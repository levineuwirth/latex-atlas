name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: CLI tests and frozen asset integrity
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Euler geometry audit
        run: python tools/check_euler.py

  presentations:
    name: Presentation integration
    needs: python
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install TeX, fonts, and PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk poppler-utils texlive-luatex texlive-latex-extra \
            texlive-fonts-recommended texlive-fonts-extra \
            texlive-plain-generic fonts-texgyre fonts-texgyre-math
      - name: Verify TeX Live font files
        # Ubuntu's separate fonts-ebgaramond package has an older family with
        # the same name; use the complete family supplied by TeX Live instead.
        run: |
          kpsewhich EBGaramond-Regular.otf
          kpsewhich EBGaramond-Bold.otf
          kpsewhich Garamond-Math.otf
          luaotfload-tool --update
      - name: Build, check, and preview real decks
        run: python3 tools/ci_smoke.py
      - name: Save PDFs, previews, and diagnostic logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presentation-checks
          path: build/ci/
          if-no-files-found: warn
          retention-days: 7
